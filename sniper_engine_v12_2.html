<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sniper Engine v12.2 Ultra</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root{
--bg:#07090f;--bg-alt:#0d1120;--surface:#111827;--surface-alt:#1a2235;--surface-hi:#1f2940;
--border:#1e2d4a;--border-light:#2e4070;--border-hi:#3a5090;
--text:#e2e8f8;--text-dim:#8892b0;--text-muted:#4a5568;
--green:#00f5a0;--green-dim:rgba(0,245,160,.12);--green-glow:0 0 20px rgba(0,245,160,.35);
--red:#ff4060;--red-dim:rgba(255,64,96,.12);--red-glow:0 0 20px rgba(255,64,96,.3);
--blue:#38bdf8;--blue-dim:rgba(56,189,248,.12);--blue-glow:0 0 20px rgba(56,189,248,.3);
--gold:#f59e0b;--gold-dim:rgba(245,158,11,.12);--gold-glow:0 0 20px rgba(245,158,11,.3);
--purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);--purple-glow:0 0 20px rgba(167,139,250,.3);
--cyan:#22d3ee;--cyan-dim:rgba(34,211,238,.1);
--orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
--pink:#f472b6;--pink-dim:rgba(244,114,182,.12);
--r:14px;--r-sm:8px;--r-lg:20px;
--ease:cubic-bezier(.4,0,.2,1);
--sh-sm:0 2px 8px rgba(0,0,0,.4);
--sh-md:0 4px 20px rgba(0,0,0,.5);
--sh-lg:0 8px 40px rgba(0,0,0,.6);
/* safe area for phones */
--sat:env(safe-area-inset-top,0px);
--sab:env(safe-area-inset-bottom,0px);
}
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100%;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(ellipse at 10% 20%,rgba(56,189,248,.04) 0,transparent 55%),radial-gradient(ellipse at 90% 80%,rgba(167,139,250,.04) 0,transparent 55%);
padding-top:var(--sat);padding-bottom:var(--sab);}
h1,h2,h3,h4,b,strong{font-family:'Inter',sans-serif;font-weight:800;}
input,button,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;border:none;background:none;color:inherit;-webkit-appearance:none;}
a{color:var(--blue);text-decoration:none;}
/* ── HEADER ── */
.hdr{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;background:rgba(13,17,32,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:14px 20px;position:sticky;top:0;z-index:200;overflow:hidden;}
.hdr::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(56,189,248,.04),transparent);animation:sweep 8s linear infinite;pointer-events:none;}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hdr-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:12px;display:grid;place-items:center;box-shadow:var(--blue-glow);flex-shrink:0;position:relative;z-index:2;}
.hdr-logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hdr-text{position:relative;z-index:2;}
.hdr-text h1{font-size:1.05rem;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2;}
.hdr-text p{font-size:.65rem;color:var(--text-muted);font-weight:500;margin-top:1px;}
.hdr-right{text-align:right;position:relative;z-index:2;flex-shrink:0;}
.hdr-right .lbl{font-size:.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
.hdr-right .clk{font-size:1rem;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(0,245,160,.5);display:block;}
/* ── NAV ── */
.nav{background:rgba(13,17,32,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:71px;z-index:100;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
.nav::-webkit-scrollbar{display:none;}
.nav-inner{display:inline-flex;padding:0 12px;min-width:100%;white-space:nowrap;}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:13px 14px;font-size:.78rem;font-weight:700;color:var(--text-muted);border-bottom:2.5px solid transparent;transition:all .2s var(--ease);min-height:46px;position:relative;}
.nav-btn.active{color:var(--blue);border-bottom-color:var(--blue);text-shadow:0 0 10px rgba(56,189,248,.5);}
.nav-btn:hover:not(.active){color:var(--text);}
.nav-pill{font-size:.6rem;font-weight:900;padding:2px 6px;border-radius:99px;background:var(--surface-alt);color:var(--text-dim);}
.nav-btn.active .nav-pill{background:var(--blue-dim);color:var(--blue);}
.nav-live{color:var(--red)!important;}
.nav-live .live-dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 1.5s infinite;}
/* ── FILE BAR ── */
.fs-bar{background:rgba(0,245,160,.05);border-bottom:1px solid rgba(0,245,160,.12);padding:6px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.72rem;}
.fs-bar .fs-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.fs-dot.connected{background:var(--green);box-shadow:0 0 6px var(--green);}
.fs-dot.disconnected{background:var(--red);}
.fs-bar .fs-info{color:var(--text-dim);flex:1;}
.fs-bar .fs-btn{padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text-dim);font-size:.7rem;font-weight:700;cursor:pointer;transition:all .2s;}
.fs-bar .fs-btn:hover{border-color:var(--green);color:var(--green);}
/* ── LAYOUT ── */
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 80px;}
.tab{display:none;animation:fadeUp .35s ease-out;}.tab.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* ── PANELS ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--sh-sm);transition:box-shadow .2s,border-color .2s;}
.panel:hover{box-shadow:var(--sh-md);border-color:var(--border-light);}
.panel-hi{border-color:var(--border-light);background:linear-gradient(135deg,var(--surface),var(--surface-alt));}
/* ── TYPOGRAPHY ── */
.eyebrow{font-size:.65rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:5px;}
.h-sec{font-size:1.45rem;font-weight:900;letter-spacing:-.03em;margin-bottom:18px;line-height:1.2;}
.sub{font-size:.85rem;color:var(--text-dim);line-height:1.5;}
.divider{height:1px;background:var(--border);margin:18px 0;}
/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.ga{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
/* ── TILES ── */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;transition:transform .2s,box-shadow .2s,border-color .2s;}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--border-light);}
.tile .k{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);}
.tile .v{font-size:1.45rem;font-weight:900;margin-top:5px;line-height:1;font-variant-numeric:tabular-nums;}
.tile .m{font-size:.72rem;color:var(--text-dim);margin-top:5px;}
.tile.t-green{background:var(--green-dim);border-color:rgba(0,245,160,.25);}.tile.t-green .v{color:var(--green);text-shadow:0 0 10px rgba(0,245,160,.4);}
.tile.t-red{background:var(--red-dim);border-color:rgba(255,64,96,.25);}.tile.t-red .v{color:var(--red);}
.tile.t-gold{background:var(--gold-dim);border-color:rgba(245,158,11,.25);}.tile.t-gold .v{color:var(--gold);}
.tile.t-blue{background:var(--blue-dim);border-color:rgba(56,189,248,.25);}.tile.t-blue .v{color:var(--blue);}
.tile.t-purple{background:var(--purple-dim);border-color:rgba(167,139,250,.25);}.tile.t-purple .v{color:var(--purple);}
.tile.t-cyan{background:var(--cyan-dim);border-color:rgba(34,211,238,.25);}.tile.t-cyan .v{color:var(--cyan);}
.tile.t-live{animation:livePulse 2s ease-in-out infinite;}
@keyframes livePulse{0%,100%{box-shadow:0 0 8px rgba(255,64,96,.2)}50%{box-shadow:0 0 20px rgba(255,64,96,.5)}}
/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:700;font-size:.85rem;min-height:44px;white-space:nowrap;transition:all .2s var(--ease);box-shadow:var(--sh-sm);}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--blue),#0077cc);color:#fff;box-shadow:0 4px 14px rgba(56,189,248,.3);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(56,189,248,.5);}
.btn-danger{background:linear-gradient(135deg,var(--red),#cc0030);color:#fff;box-shadow:0 4px 14px rgba(255,64,96,.3);}
.btn-ghost{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--blue);}
.btn-neon{background:linear-gradient(135deg,var(--green),#00cc7a);color:#000;font-weight:900;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 4px 18px rgba(0,245,160,.4);}
.btn-neon:hover{box-shadow:0 6px 24px rgba(0,245,160,.6);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d97706);color:#000;font-weight:900;box-shadow:0 4px 14px rgba(245,158,11,.3);}
.btn-sm{padding:6px 14px;font-size:.78rem;min-height:36px;}
.btn-full{width:100%;}
/* ── TAGS & CHIPS ── */
.tag{font-size:.62rem;font-weight:900;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.t-up{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(56,189,248,.25);}
.t-lv{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,64,96,.25);}
.t-lv::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite;flex-shrink:0;}
.t-fin{background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--border);}
.t-won{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,245,160,.25);}
.t-lost{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,64,96,.25);}
.t-pend{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,158,11,.25);}
.t-val{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,245,160,.3);box-shadow:0 0 8px rgba(0,245,160,.2);}
.t-prob{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(56,189,248,.25);}
.t-ghost{background:rgba(100,116,139,.15);color:var(--text-dim);border:1px dashed var(--text-muted);}
.t-ghost-hi{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(34,211,238,.25);}
.t-trap{background:var(--pink-dim);color:var(--pink);border:1px solid rgba(244,114,182,.25);}
.t-sure{background:linear-gradient(135deg,var(--gold-dim),rgba(0,245,160,.08));color:var(--gold);border:1px solid rgba(245,158,11,.4);box-shadow:0 0 8px rgba(245,158,11,.2);}
.t-guard{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(167,139,250,.3);}
.t-real{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(56,189,248,.25);font-size:.58rem;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--surface-alt);color:var(--text);border:1px solid var(--border);}
.chip.pos{background:var(--green-dim);color:var(--green);border-color:rgba(0,245,160,.25);}
.chip.neg{background:var(--red-dim);color:var(--red);border-color:rgba(255,64,96,.25);}
.chip.gold{background:var(--gold-dim);color:var(--gold);border-color:rgba(245,158,11,.25);}
.chip.info{background:var(--blue-dim);color:var(--blue);border-color:rgba(56,189,248,.25);}
.chip.trap{background:var(--pink-dim);color:var(--pink);border-color:rgba(244,114,182,.25);}
.chip.cyan{background:var(--cyan-dim);color:var(--cyan);border-color:rgba(34,211,238,.25);}
/* ── NOTICES ── */
.notice{font-size:.84rem;color:var(--text);border-radius:12px;padding:13px 17px;line-height:1.55;margin-bottom:12px;}
.notice.n-info{background:var(--blue-dim);border-left:3px solid var(--blue);}
.notice.n-success{background:var(--green-dim);border-left:3px solid var(--green);}
.notice.n-warn{background:var(--gold-dim);border-left:3px solid var(--gold);}
.notice.n-danger{background:var(--red-dim);border-left:3px solid var(--red);}
.notice.n-ghost{background:var(--cyan-dim);border-left:3px solid var(--cyan);}
.notice.n-school{background:var(--purple-dim);border-left:3px solid var(--purple);}
.notice.n-dutch{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);}
.notice.n-trap{background:var(--pink-dim);border-left:3px solid var(--pink);}
/* ── FIELDS ── */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:.78rem;font-weight:700;color:var(--text);}
.field.required label::after{content:' *';color:var(--gold);}
.field input{border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:.95rem;background:var(--bg-alt);color:var(--text);outline:none;width:100%;min-height:46px;transition:border-color .2s,box-shadow .2s;}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,189,248,.15);}
.field input::placeholder{color:var(--text-muted);}
.field.f-gold input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,.15);}
.field.f-num input{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;}
.qo{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.qo button{font-size:.68rem;font-weight:800;padding:3px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-alt);color:var(--text-dim);transition:all .15s;}
.qo button:hover{background:var(--blue-dim);color:var(--blue);border-color:rgba(56,189,248,.3);}
/* ── TABLES ── */
.tsc{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
.tsc::-webkit-scrollbar{height:4px;}.tsc::-webkit-scrollbar-track{background:var(--surface);}.tsc::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px;}
table{width:100%;border-collapse:collapse;font-size:.83rem;}
th{text-align:left;font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:11px 14px;background:var(--surface-alt);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-alt);}
tr.is-rec{background:rgba(0,245,160,.06)!important;}
tr.has-edge{background:rgba(56,189,248,.05)!important;}
tr.is-trap{background:rgba(244,114,182,.06)!important;}
tr.is-ghost-lo td{opacity:.5;}
tr.no-val td{opacity:.35;}
.ev-pos{color:var(--green);font-weight:800;}.ev-neg{color:var(--red);font-weight:700;}.ev-ok{color:var(--gold);font-weight:700;}
/* ── PROGRESS BARS ── */
.pbar-wrap{height:12px;background:var(--surface-alt);border-radius:99px;overflow:hidden;border:1px solid var(--border);}
.pbar-fill{height:100%;border-radius:99px;transition:width .8s var(--ease);position:relative;overflow:hidden;}
.pbar-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:shimmer 2s infinite;}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pb-green{background:linear-gradient(90deg,var(--green),#00cc7a);box-shadow:0 0 8px rgba(0,245,160,.4);}
.pb-gold{background:linear-gradient(90deg,var(--gold),#d97706);box-shadow:0 0 8px rgba(245,158,11,.4);}
.pb-red{background:linear-gradient(90deg,var(--red),#cc0030);box-shadow:0 0 8px rgba(255,64,96,.4);}
.pb-blue{background:linear-gradient(90deg,var(--blue),#0077cc);box-shadow:0 0 8px rgba(56,189,248,.4);}
.pb-cyan{background:linear-gradient(90deg,var(--cyan),#0891b2);box-shadow:0 0 8px rgba(34,211,238,.4);}
.pb-purple{background:linear-gradient(90deg,var(--purple),#7c3aed);box-shadow:0 0 8px rgba(167,139,250,.4);}
/* ── MODULE HEALTH ── */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px;}
.mod-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s;}
.mod-card:hover{transform:translateY(-2px);border-color:var(--border-light);}
.mod-card.health-hi{border-color:rgba(0,245,160,.3);background:rgba(0,245,160,.04);}
.mod-card.health-md{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04);}
.mod-card.health-lo{border-color:rgba(255,64,96,.3);background:rgba(255,64,96,.04);}
.mod-card .mod-status{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;}
.mod-card.health-hi .mod-status{background:var(--green);box-shadow:0 0 6px var(--green);}
.mod-card.health-md .mod-status{background:var(--gold);box-shadow:0 0 6px var(--gold);animation:pulse 1.5s infinite;}
.mod-card.health-lo .mod-status{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulse 1s infinite;}
.mod-card .mod-name{font-size:.73rem;font-weight:800;margin-bottom:4px;padding-right:16px;}
.mod-card .mod-acc{font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0;}
.mod-card .mod-sub{font-size:.65rem;color:var(--text-muted);}
.mod-card .mod-trend{font-size:.62rem;margin-top:4px;}
/* ── ISV CHECKS ── */
.isv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.isv-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface-alt);border:1px solid var(--border);font-size:.78rem;font-weight:700;}
.isv-item.pass{background:rgba(0,245,160,.08);border-color:rgba(0,245,160,.2);color:var(--green);}
.isv-item.fail{background:rgba(255,64,96,.08);border-color:rgba(255,64,96,.2);color:var(--red);}
.isv-item .isv-icon{font-size:1rem;flex-shrink:0;}
.isv-item .isv-val{margin-left:auto;font-size:.7rem;opacity:.8;}
/* ── SLIP CARDS ── */
.slip-card{position:relative;border-radius:var(--r);padding:18px;margin-bottom:14px;overflow:hidden;transition:transform .2s,box-shadow .2s;}
.slip-card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);}
.slip-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;}
.sc-anchor{background:linear-gradient(135deg,var(--surface),rgba(0,245,160,.05));border:1px solid rgba(0,245,160,.2);}
.sc-anchor::before{background:var(--green);box-shadow:0 0 8px var(--green);}
.sc-booster{background:linear-gradient(135deg,var(--surface),rgba(56,189,248,.05));border:1px solid rgba(56,189,248,.2);}
.sc-booster::before{background:var(--blue);box-shadow:0 0 8px var(--blue);}
.sc-trap{background:linear-gradient(135deg,var(--surface),rgba(245,158,11,.05));border:1px solid rgba(245,158,11,.2);}
.sc-trap::before{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.sc-dead{opacity:.6;border-color:var(--red)!important;}
.sc-dead::after{content:'DEAD';position:absolute;top:10px;right:12px;background:var(--red);color:#fff;font-size:.62rem;font-weight:900;padding:3px 9px;border-radius:6px;letter-spacing:.1em;}
/* ── LEGS ── */
.leg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.leg:last-child{border:none;padding-bottom:0;}

.mo{position:fixed;inset:0;background:rgba(5,8,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s;}

@keyframes rotate{to{transform:rotate(360deg)}}

.terminal{background:#000;border:1px solid var(--border);border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:.73rem;line-height:1.65;max-height:480px;overflow-y:auto;color:var(--green);}

/* ── DEV FOOTER ── */
.dev-footer{margin-top:40px;padding:20px;text-align:center;border-top:1px solid var(--border);}
.dev-crest{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:7px 18px 7px 7px;}
.dev-mk{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#fff;font-weight:900;font-size:.85rem;box-shadow:0 0 12px rgba(56,189,248,.4);}
.dev-tx{font-weight:800;font-size:.88rem;}
.dev-tx small{display:block;font-weight:600;font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
/* ── EMPTY STATE ── */
.empty{text-align:center;padding:56px 20px;color:var(--text-muted);}
.empty svg{width:44px;height:44px;margin-bottom:14px;opacity:.4;stroke:currentColor;fill:none;stroke-width:1.5;}
.empty h4{font-size:1.05rem;color:var(--text);margin-bottom:8px;}
.empty p{font-size:.88rem;max-width:360px;margin:0 auto 18px;color:var(--text-dim);}
/* ── ANIMATIONS ── */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes tumble{0%{transform:rotate(0)scale(1)}30%{transform:rotate(-8deg)scale(1.05)}60%{transform:rotate(370deg)scale(.9)}100%{transform:rotate(360deg)scale(1)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.pulse-txt{animation:pulseGlow 2s infinite;}
@keyframes pulseGlow{0%,100%{text-shadow:0 0 5px currentColor}50%{text-shadow:0 0 18px currentColor,0 0 28px currentColor}}

@media(max-width:740px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.cap-grid{grid-template-columns:1fr 1fr 1fr}.wrap{padding:14px 12px 60px}}

@media(min-width:1400px){.wrap{max-width:1100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
'use strict';
/*
╔══════════════════════════════════════════════════════════════════╗

╚══════════════════════════════════════════════════════════════════╝
*/

// ── CONSTANTS (v11.1 preserved) ──────────────────────────────────
const EV_THRESHOLD=0.00,MIN_REC_ODD=1.30,MIN_ODD=1.30;
const SLIP_MIN_ODD=3.15,SLIP_MAX_ODD=3.30,LEGS_PER_SLIP=3,NUM_STRATEGIES=45;

const REC_PROB_FLOOR=0.40,RISKY_EV_OVERRIDE=0.10;

const BASE_KELLY_FRACTION=0.35,DEFICIT_BOOST_MAX=0.25,PROFIT_PROTECTION_CUT=0.10;
const TARGET_DRIVEN_WEIGHT=0.60,MM=115,MAXG=8;

// Market margins (G3)
const MKT_MARGIN_DEFAULTS={x12:.072,dc:.050,o25:.062,o15:.065,o35:.070,btts:.068,cs:.140,ht:.070,other:.070};

// MKT independence (G4)
const MKT_INDEPENDENCE={'Home Win':10,'Draw':10,'Away Win':10,'Over 2.5':9,'Under 2.5':9,'Over 1.5':9,'Under 1.5':9,'BTTS Yes':8,'BTTS No':8,'HT Over 0.5':8,'HT Under 0.5':7,'Double Chance 1X':6,'Double Chance X2':6,'Double Chance 12':2,'Over 3.5':7,'Under 3.5':7,'Over 4.5':6,'Under 4.5':6,'Home to Score':5,'Away to Score':5,'Home Over 1.5':4,'Away Over 1.5':4,'Home Win to Nil':4,'Away Win to Nil':4};

// Storage keys (s108 prefix for v11.1 compatibility)
const GK='s108g',RK='s108r',AK='s108a',LK='s108l',H2HK='s108h',BK='s108b';
const TK='s108t',BLK='s108x',LGK='s108log',SWK='s108sw',LGC='s108lc';
const BSK='s108bs',MINK='s108min',MEMK='s108mem',PEAKK='s108peak';
const MMAPK='s108mmap',MPFK='s108mpf',ICBK='s108icb',CLVK='s108clv';
const LIEK='s108lie',RORSK='s108rors';

// ── DEBOUNCE UTILITY ────────────────────────────────────────────────
function debounce(fn, ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}
const debouncedSave=debounce(()=>{
  try{
    const trim=(a,n)=>a.length>n?a.slice(-n):a;
    localStorage.setItem(GK,JSON.stringify(games));
    localStorage.setItem(RK,JSON.stringify(results));
    localStorage.setItem(AK,JSON.stringify(accas));
    localStorage.setItem(H2HK,JSON.stringify(h2hDB));
    localStorage.setItem(LGK,JSON.stringify(trim(logs,200)));
    localStorage.setItem(SWK,JSON.stringify(sureWins.slice(0,50)));
    localStorage.setItem(LGC,JSON.stringify(leagueCorr));
    localStorage.setItem(BSK,JSON.stringify(bookieSig));
    localStorage.setItem(MINK,JSON.stringify(minimized));
    memory.preds=trim(memory.preds,300);memory.insights=trim(memory.insights,100);
    localStorage.setItem(MEMK,JSON.stringify(memory));
    localStorage.setItem(PEAKK,JSON.stringify(peaks));
    localStorage.setItem(MMAPK,JSON.stringify(marketMarginMap));
    localStorage.setItem(MPFK,JSON.stringify(modulePerf));
    localStorage.setItem(CLVK,JSON.stringify(trim(clvHistory,200)));
    localStorage.setItem(LIEK,JSON.stringify(leagueIntel));
    localStorage.setItem(RORSK,JSON.stringify(rorSettings));
    setTimeout(()=>fsWriteAll(),500); // Async file write 500ms after save
  }catch(e){log_('warn','SAVE',e.message);}
},2000); // Debounced: max one save per 2 seconds

// ── STATE ─────────────────────────────────────────────────────────
let games=load(GK,[]),results=load(RK,{}),accas=load(AK,[]),h2hDB=load(H2HK,{});
let logs=load(LGK,[]),sureWins=load(SWK,[]),leagueCorr=load(LGC,{});
let bookieSig=load(BSK,{}),minimized=load(MINK,{});
let memory=load(MEMK,{preds:[],studies:0,comparisons:0,insights:[]});
let peaks=load(PEAKK,{iq:100,learning:0});
let marketMarginMap=load(MMAPK,{});
let modulePerf=load(MPFK,{});
let clvHistory=load(CLVK,[]);
let leagueIntel=load(LIEK,{});
let rorSettings=load(RORSK,{targetRoR:0.10,warningRoR:0.30});
let nextStrategy=null,pCache=new Map(),engSel=null,trackerV='results';

function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v!=null?v:d;}catch(e){return d;}}
function save(){debouncedSave();} // Debounced: batches rapid saves
function fmtEAT12(ts){
  // Always EAT (Africa/Kampala = UTC+3), always 12hr
  return new Date(ts).toLocaleString('en-US',{
    timeZone:'Africa/Kampala',
    month:'2-digit',day:'2-digit',
    hour:'numeric',minute:'2-digit',second:'2-digit',
    hour12:true
  });
}
function log_(level,cat,msg,data=null){
  const entry={t:Date.now(),l:level,c:cat,m:msg,d:data?JSON.stringify(data).slice(0,200):null};
  logs.push(entry);if(logs.length>200)logs.shift();
  const timeStr=fmtEAT12(entry.t);
  fsAppendLog(`[${timeStr} EAT][${level.toUpperCase()}][${cat}] ${msg}`);
}

// ── HELPERS ───────────────────────────────────────────────────────
const clamp=(x,lo=.001,hi=.999)=>Math.min(hi,Math.max(lo,x));
const pct=x=>(x*100).toFixed(1)+'%';
const od=x=>(+x).toFixed(2);
const FC=[1];for(let i=1;i<=20;i++)FC[i]=FC[i-1]*i;
function pois(k,l){if(l<=0)return k===0?1:0;if(k>20)return 0;return Math.exp(-l)*Math.pow(l,k)/FC[k];}
function crestColor(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return`hsl(${h},52%,40%)`;}
function crestAbbr(n){const w=n.trim().split(/\s+/);return w.length===1?w[0].slice(0,3).toUpperCase():(w[0][0]+w[1][0]+(w[2]?w[2][0]:w[1][1]||'')).toUpperCase();}
function crest(n){return`<span class="crest" style="background:${crestColor(n)}">${crestAbbr(n)}</span>`;}
function statusOf(g){if(!g.start)return'upcoming';const now=Date.now(),st=new Date(g.start).getTime();return now<st?'upcoming':now<st+MM*60000?'live':'finished';}
function byStatus(s){return games.filter(g=>statusOf(g)===s);}
function analysable(){return games.filter(g=>statusOf(g)!=='finished');}
function fmtDate(iso){try{return new Date(iso).toLocaleString('en-US',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return iso;}}
function fmtShort(iso){try{return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}catch(e){return'';}}
function fmtSize(bytes){if(bytes<1024)return bytes+'B';if(bytes<1048576)return(bytes/1024).toFixed(1)+'KB';return(bytes/1048576).toFixed(1)+'MB';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function empty(t,b,tb,lb){return`<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg><h4>${esc(t)}</h4><p>${esc(b)}</p>${tb?`<button class="btn btn-ghost" onclick="go('${tb}')">${esc(lb)}</button>`:''}</div>`;}
function getBankroll(){return parseInt(localStorage.getItem(BK)||'30000');}
function setBankroll(){const el=document.getElementById('bankroll-input');if(!el)return;const v=parseInt(el.value);if(!isNaN(v)&&v>=1000){localStorage.setItem(BK,String(v));el.style.borderColor='var(--green)';log_('info','BANKROLL',`Set: ${v}`);setTimeout(()=>{el.style.borderColor='';renderTracker();renderDash();},600);}else el.style.borderColor='var(--red)';}
function loadTargets(){try{const v=JSON.parse(localStorage.getItem(TK));if(!v)return defTargets();if(!v.daily.startTime)v.daily.startTime=Date.now();if(!v.weekly.startTime)v.weekly.startTime=Date.now();if(!v.monthly.startTime)v.monthly.startTime=Date.now();return v;}catch(e){return defTargets();}}
function defTargets(){return{daily:{target:50000,startTime:Date.now()},weekly:{target:200000,startTime:Date.now()},monthly:{target:1000000,startTime:Date.now()}};}
function saveTargets(t){localStorage.setItem(TK,JSON.stringify(t));}
function updateTarget(key,value){const t=loadTargets();t[key].target=parseInt(value)||0;saveTargets(t);renderTracker();renderDash();}

// ═══════════════════════════════════════════════════════════════════
// MODULE A — INTER-MODULE COMMUNICATION BUS (ICB)
// Every module publishes its output here. Every module reads from here.
// Before any decision, modules check ICB for all other module signals.
// ═══════════════════════════════════════════════════════════════════
const ICB={
  _state:{},
  _subs:{},
  _history:[],
  _actives:new Set(),
  publish(module,key,value){
    const fk=`${module}.${key}`;
    this._state[fk]={value,ts:Date.now(),module};
    this._history.push({module,key,ts:Date.now()});
    if(this._history.length>500)this._history.shift();
    this._actives.add(module);
    if(this._subs[fk])this._subs[fk].forEach(cb=>{try{cb(value);}catch(e){}});
    if(this._subs['*'])this._subs['*'].forEach(cb=>{try{cb({module,key,value});}catch(e){}});
    // Update module performance tracker
    mpRecord(module,'active',true);
  },
  subscribe(key,cb){if(!this._subs[key])this._subs[key]=[];this._subs[key].push(cb);},
  get(module,key,def=null){return(this._state[`${module}.${key}`]||{}).value??def;},
  getAll(){return Object.fromEntries(Object.entries(this._state).map(([k,v])=>[k,v.value]));},
  getActive(){return Array.from(this._actives);},
  getRecentHistory(n=20){return this._history.slice(-n);}
};

function mpRecord(moduleId,key,value){
  if(!modulePerf[moduleId])modulePerf[moduleId]={preds:0,correct:0,history:[],lastSeen:Date.now(),health:80};
  const m=modulePerf[moduleId];m.lastSeen=Date.now();
  if(key==='prediction'){m.preds++;if(value)m.correct++;}
  if(key==='active')m.health=Math.min(100,m.health+2);
  const acc=m.preds>0?m.correct/m.preds:null;
  if(acc!==null){m.history.push({t:Date.now(),acc});if(m.history.length>50)m.history.shift();}
}
function mpGetStatus(moduleId){
  const m=modulePerf[moduleId]||{preds:0,correct:0,history:[],lastSeen:0,health:80};
  const acc=m.preds>0?(m.correct/m.preds*100).toFixed(1)+'%':'—';
  const isRecent=(Date.now()-m.lastSeen)<3600000;
  const trend=m.history.length>3?(m.history[m.history.length-1].acc>m.history[m.history.length-3].acc?'↑':'→'):'→';
  const health=m.health||(isRecent?80:40);
  return{acc,health,trend,preds:m.preds,lastSeen:m.lastSeen,active:isRecent};
}

// MODULE H — LOCAL FILE SYSTEM ENGINE
// Uses File System Access API (Chrome/Edge) to create real files
// showDirectoryPicker() → user picks folder once → stored in IndexedDB
// Creates: Sniper_Data/sniper_games.json, sniper_logs.txt,
//          sniper_learning.json, sniper_h2h.json, sniper_config.json
// Falls back to localStorage-only on unsupported browsers
// ═══════════════════════════════════════════════════════════════════
let fsHandle=null,fsFiles={},fsConnected=false,fsSizes={};
const FS_FOLDER='Sniper_Data';
const FS_NAMES={games:'sniper_games.json',logs:'sniper_logs.txt',learning:'sniper_learning.json',h2h:'sniper_h2h.json',config:'sniper_config.json'};
const IDB_KEY='sniper_dir_handle';

async function fsInit(){
  try{
    const idb=await idbGet(IDB_KEY);
    if(idb){
      // Try silent auto-reconnect first (works if permission persisted)
      fsUpdateBar('reconnecting');
      const perm=await idb.queryPermission({mode:'readwrite'});
      if(perm==='granted'){await fsSetHandle(idb);return;}
      // Permission revoked on browser close — silently request again
      // This may succeed automatically on some Chrome versions
      const req=await idb.requestPermission({mode:'readwrite'});
      if(req==='granted'){await fsSetHandle(idb);return;}
      // Could not auto-reconnect — show "Reconnect" button clearly
      fsUpdateBar('needs_reconnect');
      return;
    }
  }catch(e){console.warn('fsInit:',e);}
  fsUpdateBar('disconnected');
}
// Called when user taps Reconnect — tries to use saved handle first
async function fsReconnect(){
  try{
    const idb=await idbGet(IDB_KEY);
    if(idb){
      const req=await idb.requestPermission({mode:'readwrite'});
      if(req==='granted'){await fsSetHandle(idb);return;}
    }
  }catch(e){}
  // Saved handle failed — do fresh connect
  await fsConnect();
}
async function fsConnect(){
  if(!window.showDirectoryPicker){showNotice('File System Access API not supported on this browser. Use Chrome or Edge.','warn');return;}
  try{
    const dir=await window.showDirectoryPicker({id:'sniper',mode:'readwrite',startIn:'documents'});
    await idbSet(IDB_KEY,dir);
    await fsSetHandle(dir);
    log_('ok','FS',`Folder connected: ${dir.name}`);
  }catch(e){if(e.name!=='AbortError')showNotice('Could not connect folder: '+e.message,'danger');}
}
async function fsSetHandle(dirHandle){
  try{
    // Create or get Sniper_Data subfolder
    const sub=await dirHandle.getDirectoryHandle(FS_FOLDER,{create:true});
    fsHandle=sub;fsConnected=true;
    // Get or create all files
    for(const[k,name]of Object.entries(FS_NAMES)){
      fsFiles[k]=await sub.getFileHandle(name,{create:true});
    }
    await fsReadAll();
    fsUpdateBar();
    fsUpdateSizes();
    mpRecord('filesystem','active',true);
    log_('ok','FS',`Files ready in ${FS_FOLDER}/`);
  }catch(e){log_('err','FS',e.message);fsConnected=false;fsUpdateBar();}
}
async function fsWriteAll(){
  if(!fsConnected||!fsHandle)return;
  try{
    const now=Date.now();
    await fsWriteJSON('games',{games,results,accas,ts:now});
    await fsWriteJSON('learning',{memory,peaks,marketMarginMap,bookieSig,sureWins,leagueCorr,clvHistory,leagueIntel,modulePerf,ts:now});
    await fsWriteJSON('h2h',{h2hDB,ts:now});
    await fsWriteJSON('config',{bankroll:getBankroll(),targets:loadTargets(),rorSettings,ts:now});
    await fsUpdateSizes();
    mpRecord('filesystem','active',true);
  }catch(e){log_('err','FS_WRITE',e.message);}
}
async function fsReadAll(){
  if(!fsConnected)return;
  try{
    const g=await fsReadJSON('games');
    if(g){
      if(g.games)games=g.games;
      if(g.results)results=g.results;
      if(g.accas)accas=g.accas;
    }
    const l=await fsReadJSON('learning');
    if(l){
      if(l.memory)memory=l.memory;
      if(l.peaks)peaks=l.peaks;
      if(l.marketMarginMap)marketMarginMap=l.marketMarginMap;
      if(l.bookieSig)bookieSig=l.bookieSig;
      if(l.sureWins)sureWins=l.sureWins;
      if(l.leagueCorr)leagueCorr=l.leagueCorr;
      if(l.clvHistory)clvHistory=l.clvHistory;
      if(l.leagueIntel)leagueIntel=l.leagueIntel;
      if(l.modulePerf)modulePerf=l.modulePerf;
    }
    const h=await fsReadJSON('h2h');
    if(h&&h.h2hDB)h2hDB=h.h2hDB;
    const c=await fsReadJSON('config');
    if(c){
      if(c.bankroll)localStorage.setItem(BK,String(c.bankroll));
      if(c.targets)saveTargets(c.targets);
      if(c.rorSettings)rorSettings=c.rorSettings;
    }
    log_('ok','FS_READ','All files loaded from device');
  }catch(e){log_('err','FS_READ',e.message);}
}
async function fsWriteJSON(key,data){
  if(!fsFiles[key])return;
  try{
    const w=await fsFiles[key].createWritable();
    await w.write(JSON.stringify(data,null,1));
    await w.close();
  }catch(e){throw e;}
}
async function fsReadJSON(key){
  if(!fsFiles[key])return null;
  try{
    const f=await fsFiles[key].getFile();
    const txt=await f.text();
    if(!txt||txt.trim()==='')return null;
    return JSON.parse(txt);
  }catch(e){return null;}
}
async function fsAppendLog(msg){
  if(!fsConnected||!fsFiles.logs)return;
  try{
    const f=await fsFiles.logs.getFile();
    const existing=await f.text();
    const ts=new Date().toISOString().slice(0,19).replace('T',' ');
    const newLine=`[${ts}] ${msg}\n`;
    // Trim to keep log manageable (last 10MB)
    let content=existing+newLine;
    if(content.length>10*1024*1024)content=content.slice(content.length-8*1024*1024);
    const w=await fsFiles.logs.createWritable();
    await w.write(content);
    await w.close();
  }catch(e){}
}
async function fsUpdateSizes(){
  if(!fsConnected)return;
  try{
    for(const[k,fh]of Object.entries(fsFiles)){
      const f=await fh.getFile();
      fsSizes[k]={size:f.size,lastMod:f.lastModified,name:f.name};
    }
    fsUpdateBar();
  }catch(e){}
}
function fsUpdateBar(state){
  const dot=document.getElementById('fs-dot');
  const info=document.getElementById('fs-info');
  const btn=document.querySelector('.fs-btn');
  if(!dot||!info)return;
  if(fsConnected){
    dot.className='fs-dot connected';
    const totalSize=Object.values(fsSizes).reduce((s,f)=>s+(f.size||0),0);
    const lastMod=Object.values(fsSizes).reduce((m,f)=>Math.max(m,f.lastMod||0),0);
    const lastStr=lastMod?new Date(lastMod).toLocaleString('en-US',{timeZone:'Africa/Kampala',hour12:true,hour:'numeric',minute:'2-digit',month:'short',day:'numeric'}):'—';
    info.innerHTML=`📂 <b>${FS_FOLDER}/</b> connected · Total: <b>${fmtSize(totalSize)}</b> · Last saved: <b>${lastStr} EAT</b>`;
    if(btn){btn.textContent='ℹ️ Info';btn.onclick=()=>fsShowInfo();}
  }else if(state==='reconnecting'){
    dot.className='fs-dot disconnected';
    info.innerHTML='🔄 <b>Reconnecting</b> to Sniper_Data folder…';
  }else if(state==='needs_reconnect'){
    dot.className='fs-dot disconnected';
    info.innerHTML='📂 <b>Sniper_Data</b> found — tap to reconnect (browser closed, permission reset). Your data is safe.';
    if(btn){btn.textContent='🔄 Reconnect';btn.onclick=()=>fsReconnect();}
  }else{
    dot.className='fs-dot disconnected';
    info.textContent='📂 Folder not connected — tap Connect to create Sniper_Data folder';
    if(btn){btn.textContent='📂 Connect Folder';btn.onclick=()=>fsConnect();}
  }
}
async function fsShowInfo(){
  await fsUpdateSizes();
  const rows=Object.entries(FS_NAMES).map(([k,name])=>{
    const s=fsSizes[k];
    return s?`<tr><td><b>${name}</b></td><td>${fmtSize(s.size)}</td><td>${s.lastMod?new Date(s.lastMod).toLocaleString():'—'}</td></tr>`:
              `<tr><td><b>${name}</b></td><td colspan="2" style="color:var(--text-muted)">Not yet written</td></tr>`;
  }).join('');
  showModal(`<h3>💾 File System Info</h3><p>Folder: <b>${FS_FOLDER}/</b><br>Status: <b style="color:${fsConnected?'var(--green)':'var(--red)'}">${fsConnected?'Connected':'Disconnected'}</b></p><div class="tsc" style="margin-top:12px"><table><thead><tr><th>File</th><th>Size</th><th>Last Modified</th></tr></thead><tbody>${rows}</tbody></table></div><div class="notice n-info" style="margin-top:12px;font-size:.8rem">To move to a new device: copy the <b>${FS_FOLDER}/</b> folder to the new device, then click <b>Connect Folder</b> and select it.</div><div class="mo-btns"><button class="btn btn-ghost" onclick="closeM()">Close</button></div>`);
}
// IndexedDB helpers for handle persistence
async function idbSet(key,val){return new Promise((res,rej)=>{const r=indexedDB.open('sniper_fs',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('store');r.onsuccess=e=>{const db=e.target.result;const tx=db.transaction('store','readwrite');tx.objectStore('store').put(val,key);tx.oncomplete=()=>{db.close();res();}};r.onerror=rej;});}
async function idbGet(key){return new Promise((res,rej)=>{const r=indexedDB.open('sniper_fs',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('store');r.onsuccess=e=>{const db=e.target.result;const tx=db.transaction('store','readonly');const req=tx.objectStore('store').get(key);req.onsuccess=()=>{db.close();res(req.result||null);};req.onerror=rej;};r.onerror=rej;});}

// ═══════════════════════════════════════════════════════════════════
// DEVIG ENGINE (v11.1 preserved — Power/Shin/OddsRatio/FLB)
// ═══════════════════════════════════════════════════════════════════
function powerDevig(odds){
  const imp=odds.map(o=>1/Math.max(o,1.01));
  const S=imp.reduce((a,b)=>a+b,0);
  if(S<=1)return imp.map(p=>p/S);
  let lo=0.5,hi=5.0,k=1.0;
  for(let i=0;i<60;i++){k=(lo+hi)/2;const s=imp.reduce((s,p)=>s+Math.pow(p,k),0);if(Math.abs(s-1)<1e-10)break;if(s>1)lo=k;else hi=k;}
  const raw=imp.map(p=>Math.pow(p,k)),norm=raw.reduce((a,b)=>a+b,0);
  return raw.map(p=>clamp(p/norm));
}
function shinDevig(odds){
  const q=odds.map(o=>1/Math.max(o,1.01));
  const Sq=q.reduce((a,b)=>a+b,0);
  if(Sq<=1)return q.map(qi=>qi/Sq);
  const shinP=(qi,z)=>{const inner=z*z+4*(1-z)*(qi*qi/Sq);return inner<0?qi/Sq:(Math.sqrt(inner)-z)/(2*(1-z));};
  let lo=0.0,hi=0.5;
  for(let i=0;i<80;i++){const mid=(lo+hi)/2;const s=q.reduce((s,qi)=>s+shinP(qi,mid),0);if(Math.abs(s-1)<1e-10)break;if(s>1)lo=mid;else hi=mid;}
  const z=(lo+hi)/2,raw=q.map(qi=>shinP(qi,z)),norm=raw.reduce((a,b)=>a+b,0);
  return raw.map(p=>clamp(p/norm));
}
function oddsRatioDevig(odds){
  const q=odds.map(o=>clamp(1/Math.max(o,1.01)));
  const S=q.reduce((a,b)=>a+b,0);
  if(S<=1)return q.map(qi=>qi/S);
  const pC=(qi,c)=>{const r=c*qi/(1-qi);return r/(1+r);};
  const sumP=c=>q.reduce((s,qi)=>s+pC(qi,c),0);
  let lo=0.01,hi=10.0;
  for(let i=0;i<80;i++){const mid=(lo+hi)/2;if(Math.abs(sumP(mid)-1)<1e-10)break;if(sumP(mid)>1)hi=mid;else lo=mid;}
  const c=(lo+hi)/2,raw=q.map(qi=>pC(qi,c)),norm=raw.reduce((a,b)=>a+b,0);
  return raw.map(p=>clamp(p/norm));
}
function flbCorrect(p){
  if(p>=0.65)return clamp(p+0.02);if(p>=0.50)return clamp(p+0.01);
  if(p>=0.35)return clamp(p);if(p>=0.20)return clamp(p-0.02);
  if(p>=0.12)return clamp(p-0.03);return clamp(p-0.04);
}
function consensusDevig(odds){
  if(!odds||odds.some(o=>!o||o<=1))return null;
  const p=powerDevig(odds),s=shinDevig(odds),r=oddsRatioDevig(odds);
  const mn=Math.min(...odds),mx=Math.max(...odds);
  let wp,ws,wo;
  if(mn<1.35){wp=0.35;ws=0.15;wo=0.50;}
  else if(mn<1.70){wp=0.45;ws=0.20;wo=0.35;}
  else if(mx>5.0){wp=0.35;ws=0.50;wo=0.15;}
  else{wp=0.50;ws=0.35;wo=0.15;}
  const c=odds.map((_,i)=>clamp(p[i]*wp+s[i]*ws+r[i]*wo));
  const norm=c.reduce((a,b)=>a+b,0);
  ICB.publish('devig','last_method',{power:wp,shin:ws,oddsRatio:wo});
  mpRecord('devig','active',true);
  return c.map(x=>clamp(x/norm));
}
function getPairedDevig(oddsA,oddsB){
  if(oddsA>1&&oddsB>1){const d=consensusDevig([oddsA,oddsB]);if(!d)return{probA:.5,probB:.5};const s=d[0]+d[1];return{probA:clamp(d[0]/s),probB:clamp(d[1]/s)};}
  if(oddsA>1){const t=clamp((1/oddsA)/1.065);return{probA:t,probB:clamp(1-t)};}
  return{probA:.5,probB:.5};
}

// MODULE D — CORRELATION MATRIX ENGINE
// Computes correlations between market pairs from Dixon-Coles score matrix
// Positively correlated legs preferred in same slip
// ═══════════════════════════════════════════════════════════════════
function computeCorrelationMatrix(P,l1,l2){
  let hw=0,dr=0,aw=0,o25=0,u25=0,bt=0,bno=0;
  let hw_o25=0,hw_u25=0,hw_bt=0,dr_o25=0,aw_o25=0,dr_u25=0;
  for(let i=0;i<=MAXG;i++){
    for(let j=0;j<=MAXG;j++){
      const p=P[i][j],t=i+j;
      if(i>j){hw+=p;if(t>=3)hw_o25+=p;if(t<3)hw_u25+=p;if(i>=1&&j>=1)hw_bt+=p;}
      else if(i===j){dr+=p;if(t>=3)dr_o25+=p;if(t<3)dr_u25+=p;}
      else{aw+=p;if(t>=3)aw_o25+=p;}
      if(t>=3)o25+=p;else u25+=p;
      if(i>=1&&j>=1)bt+=p;else bno+=p;
    }
  }
  const corr=(pAB,pA,pB)=>{
    const d=Math.sqrt(Math.max(pA*(1-pA)*pB*(1-pB),1e-10));
    return(pAB-pA*pB)/d;
  };
  const matrix={
    'hw_o25':corr(hw_o25,hw,o25),
    'hw_u25':corr(hw_u25,hw,u25),
    'hw_bt': corr(hw_bt,hw,bt),
    'dr_o25':corr(dr_o25,dr,o25),
    'dr_u25':corr(dr_u25,dr,u25),
    'aw_o25':corr(aw_o25,aw,o25),
  };
  ICB.publish('correlation','matrix',matrix);
  mpRecord('correlation','active',true);
  return matrix;
}
function getCorrScore(mkt1,mkt2,corrMatrix){
  if(!corrMatrix)return 0;
  const key=`${outCatShort(mkt1)}_${mktCatShort(mkt2)}`;
  const altKey=`${outCatShort(mkt2)}_${mktCatShort(mkt1)}`;
  return corrMatrix[key]||corrMatrix[altKey]||0;
}
function outCatShort(n){return n==='Home Win'?'hw':n==='Draw'?'dr':n==='Away Win'?'aw':'other';}
function mktCatShort(n){return n==='Over 2.5'||n==='Over 3.5'||n==='Over 4.5'?'o25':n==='Under 2.5'?'u25':n==='BTTS Yes'?'bt':'other';}

// Slip correlation bonus: sum of pairwise correlations of legs
function slipCorrBonus(legs,corrMatrix){
  if(!corrMatrix||legs.length<2)return 0;
  let total=0,pairs=0;
  for(let i=0;i<legs.length;i++)for(let j=i+1;j<legs.length;j++){
    total+=getCorrScore(legs[i].m.name,legs[j].m.name,corrMatrix);
    pairs++;
  }
  return pairs>0?total/pairs:0;
}

// ═══════════════════════════════════════════════════════════════════
// MODULE E — RISK OF RUIN ENGINE
// ═══════════════════════════════════════════════════════════════════
function calcRoR(edge,bankroll,unitStake){
  if(edge<=0||bankroll<=0||unitStake<=0)return 1.0;
  const ratio=(1-edge)/(1+edge);
  if(ratio>=1)return 1.0;
  const units=bankroll/Math.max(unitStake,1);
  return Math.pow(ratio,units);
}
function rorClass(ror){return ror<0.10?'safe':ror<0.30?'warn':'danger';}
function rorColor(ror){return ror<0.10?'var(--green)':ror<0.30?'var(--gold)':'var(--red)';}
function safestake(edge,bankroll,targetRoR=0.10){
  if(edge<=0)return MIN_STAKE_FLOOR;
  const ratio=(1-edge)/(1+edge);
  if(ratio<=0||ratio>=1)return bankroll*0.05;
  const minUnits=Math.log(targetRoR)/Math.log(ratio);
  const maxStake=bankroll/Math.max(minUnits,1);
  return Math.max(MIN_STAKE_FLOOR,Math.round(Math.min(maxStake,bankroll*MAX_STAKE_CAP_PCT)/100)*100);
}
ICB.subscribe('isv.validated_slip',v=>{
  if(v){const edge=Math.max(0,(v.prob||0)*(v.odd||1)-1);ICB.publish('ror','edge',edge);mpRecord('ror','active',true);}
});

// MODULE F — LEAGUE INTELLIGENCE ENGINE
// Per-league base rate tracking and calibration
// ═══════════════════════════════════════════════════════════════════
function lieRecord(league,hg,ag){
  if(!league)return;
  if(!leagueIntel[league])leagueIntel[league]={n:0,o25:0,o15:0,bt:0,hw:0,dr:0,aw:0,goals:0,clean:0};
  const d=leagueIntel[league],t=hg+ag;
  d.n++;if(t>=3)d.o25++;if(t>=2)d.o15++;
  if(hg>=1&&ag>=1)d.bt++;

function clvRecord(gameId,market,openOdd,estClosingOdd,won){

function clvAutoEstimate(pred,gameId,market){

function computePred(g){
  const o=g.odds||{};
  if(!(o.home>1&&o.draw>1&&o.away>1&&o.o25>1))return null;
  const f=fitModel(o),l1=f.l1,l2=f.l2,rho=f.rho,lT=l1+l2;

  // Build full score matrix P[i][j] (needed for correlation engine)
  const pm1=nbPmf(l1,f.disp),pm2=nbPmf(l2,f.disp);
  const P=[];let tot=0;
  for(let i=0;i<=MAXG;i++){P[i]=[];for(let j=0;j<=MAXG;j++){let v=tau(i,j,l1,l2,rho)*pm1[i]*pm2[j];if(v<0)v=0;P[i][j]=v;tot+=v;}}
  if(tot<=0)return null;
  for(let i=0;i<=MAXG;i++)for(let j=0;j<=MAXG;j++)P[i][j]/=tot;

  // Aggregate probabilities
  let hw=0,dr=0,aw=0,o15=0,o25=0,o35=0,o45=0,bt=0,hw1=0,hw2=0,aw1=0,aw2=0,htn=0,atn=0;

    if(i>=1&&j>=1)bt+=p;if(i>=1)hw1+=p;if(i>=2)hw2+=p;if(j>=1)aw1+=p;if(j>=2)aw2+=p;
    if(i>j&&j===0)htn+=p;if(j>i&&i===0)atn+=p;

  }
  csAll.sort((a,b)=>b.prob-a.prob);
  const topCS=csAll[0],csList=csAll.slice(0,10);

  // HT probs
  const l1h=.45*l1,l2h=.45*l2,pm1h=pmf(l1h),pm2h=pmf(l2h);
  let htot=0,htO05=0,htO15=0;const ht=[];
  for(let i=0;i<=4;i++)for(let j=0;j<=4;j++){let v=tau(i,j,l1h,l2h,rho)*pm1h[i]*pm2h[j];if(v<0)v=0;ht.push({i,j,score:i+'-'+j,prob:v});htot+=v;if(i+j>=1)htO05+=v;if(i+j>=2)htO15+=v;}

  const x12TrueNorm=x12TrueFlb.map(p=>clamp(p/flbSum));
  ICB.publish('devig','x12_true',x12TrueNorm);

  // Paired devig for optional markets
  const bttsPair=getPairedDevig(o.btts,null);
  const o25Pair=getPairedDevig(o.o25,null);
  const o15Pair=getPairedDevig(o.o15,null);
  const ht05Pair=getPairedDevig(o.hto05,null);

    const oc=outCat(name);if(oc&&school.corrections[oc])p*=school.corrections[oc];

    if(fromInput){

      else if(name==='Draw'){trueProb=x12TrueNorm[1];fairOdd=Math.round((1/trueProb)*20)/20;ghostOdd=fairOdd;ghostMethod='consensus+FLB';}

    buildMkt('Under 1.5',Math.min(1-o15,o15Pair.probB<.6?o15Pair.probB:1-o15),null),

    buildMkt('Under 2.5',Math.min(1-o25,o25Pair.probB<.7?o25Pair.probB:1-o25),null),
    buildMkt('Over 3.5',o35,null),buildMkt('Under 3.5',1-o35,null),
    buildMkt('Over 4.5',o45,null),buildMkt('Under 4.5',1-o45,null),

    buildMkt('BTTS No',Math.min(1-bt,bttsPair.probB<.7?bttsPair.probB:1-bt),null),
    buildMkt('HT Over 0.5',Math.max(htO05,ht05Pair.probA>.3?ht05Pair.probA:htO05),o.hto05),
    buildMkt('HT Under 0.5',Math.min(1-htO05,ht05Pair.probB<.7?ht05Pair.probB:1-htO05),null),
    buildMkt('HT Over 1.5',htO15,null),
    buildMkt('Home to Score',hw1,null),buildMkt('Away to Score',aw1,null),
    buildMkt('Home Over 1.5',hw2,null),buildMkt('Away Over 1.5',aw2,null),

  if(best){const t5h=top5.filter(x=>x.i>x.j).length,t5a=top5.filter(x=>x.i<x.j).length;if(best.name==='Home Win'&&t5a>=4)consistent=false;if(best.name==='Away Win'&&t5h>=4)consistent=false;if(!consistent){const alt=recPool.find(m=>m!==best&&!(m.name==='Home Win'&&t5a>=4)&&!(m.name==='Away Win'&&t5h>=4));if(alt){best=alt;consistent=true;}}}

// ═══════════════════════════════════════════════════════════════════
// MODULE B — INTELLIGENT SLIP VALIDATOR (ISV) — 8 checks
// Asks itself: "Are all slips winning or returning stake?"
// Auto-rebuilds if ANY check fails
// ═══════════════════════════════════════════════════════════════════
function isvValidate(slipLegs,bankroll,stake,corrMatrix){
  const checks={};
  // Check 1: Combined win probability > 35%
  const combinedProb=slipLegs.reduce((p,l)=>p*(l.prob||l.m?.corrProb||.5),1);
  checks.combined_prob={pass:combinedProb>0.35,label:'Combined Win Prob >35%',value:pct(combinedProb),critical:true};
  // Check 2: At least 1 leg has entered (real) odd
  const hasReal=slipLegs.some(l=>l.m?.fromInput||l.fromInput);
  checks.has_real={pass:hasReal,label:'Has ≥1 Real Entered Odd',value:hasReal?'YES':'NO',critical:false};
  // Check 3: No trapped markets in slip
  const noTraps=slipLegs.every(l=>!(l.m?.isTrap||l.isTrap));
  checks.no_traps={pass:noTraps,label:'No Bookie Traps',value:noTraps?'CLEAN':'TRAP FOUND',critical:true};
  // Check 4: Ghost confidence >50% for all ghost legs
  const confOk=slipLegs.every(l=>(l.m?.fromInput||l.fromInput)||((l.m?.ghostConf||l.ghostConf||0)>=50));
  checks.ghost_conf={pass:confOk,label:'Ghost Confidence >50%',value:confOk?'OK':'LOW CONF',critical:false};
  // Check 5: No duplicate games
  const gids=slipLegs.map(l=>l.g?.id||l.gid||'');
  const noDups=gids.length===new Set(gids).size;
  checks.no_dups={pass:noDups,label:'No Duplicate Games',value:noDups?'UNIQUE':'DUPLICATE',critical:true};
  // Check 6: Combined odd in band 3.15-3.30 (stake recovery guarantee at 3.2)
  const combinedOdd=slipLegs.reduce((o,l)=>o*(l.useOdd||l.odd||1),1);
  const inBand=combinedOdd>=3.15&&combinedOdd<=3.30;
  checks.odd_band={pass:inBand,label:'Odd 3.15–3.30 (stake recovery)',value:od(combinedOdd),critical:true};
  // Check 7: Risk of Ruin <30%
  const edge=Math.max(0,combinedProb*combinedOdd-1);
  const ror=calcRoR(edge,bankroll,stake);
  const rorOk=ror<0.30;
  checks.ror={pass:rorOk,label:'Risk of Ruin <30%',value:(ror*100).toFixed(1)+'%',critical:false};
  // Check 8: Minimum single-leg prob ≥55% (raised from 45% for loss-rate target)
  const minProb=Math.min(...slipLegs.map(l=>l.prob||l.m?.corrProb||0));
  const minOk=minProb>=0.55;
  checks.min_leg={pass:minOk,label:'Each Leg Prob ≥55%',value:pct(minProb),critical:false};

  const passes=Object.values(checks).filter(c=>c.pass).length;
  const criticalFail=Object.values(checks).some(c=>c.critical&&!c.pass);
  const valid=passes>=6&&!criticalFail;
  ICB.publish('isv','result',{valid,passes,combinedProb,combinedOdd,ror});
  if(valid)ICB.publish('isv','validated_slip',{prob:combinedProb,odd:combinedOdd,stake});
  mpRecord('isv','prediction',valid);
  return{checks,passes,total:8,valid,combinedProb,combinedOdd,ror,edge};
}
// v12.1 Dutch system validator — all 3 slips, P(all lose)<=10%
function isvDutchCheck(s1,s2,s3){
  if(!s1||!s2||!s3)return{passes:false,pWin:0,pLose:1};
  const p1=s1.prob||0,p2=s2.prob||0,p3=s3.prob||0;
  const pLose=(1-p1)*(1-p2)*(1-p3);
  const pWin=1-pLose;
  const passes=pWin>=0.90;
  ICB.publish('isv','dutch_check',{pWin,pLose,passes});
  return{passes,pWin,pLose,pWinPct:(pWin*100).toFixed(1),pLosePct:(pLose*100).toFixed(1)};
}

// ═══════════════════════════════════════════════════════════════════
// STAKING — Target-driven Kelly (v11.1 preserved)
// Now integrated with RoR module
// ═══════════════════════════════════════════════════════════════════
function calcTargetDrivenStake(edge,odds,bankroll,targets,currentPnL,slipRole){
  const dailyTarget=targets.daily.target||50000;
  const targetStakePerSlip=dailyTarget/Math.max(odds-1,.5)/3;
  let rawKelly=0;if(edge>0&&odds>1)rawKelly=edge/(odds-1);
  const deficit=Math.max(0,dailyTarget-currentPnL),deficitRatio=clamp(deficit/dailyTarget,0,1);
  const profitBuffer=Math.max(0,currentPnL),profitRatio=clamp(profitBuffer/dailyTarget,0,1);
  let elasticFraction=BASE_KELLY_FRACTION+(deficitRatio*DEFICIT_BOOST_MAX)-(profitRatio*PROFIT_PROTECTION_CUT);
  elasticFraction=clamp(elasticFraction,.20,.60);
  const kellyStake=bankroll*rawKelly*elasticFraction;
  const blendedStake=(targetStakePerSlip*TARGET_DRIVEN_WEIGHT)+(kellyStake*(1-TARGET_DRIVEN_WEIGHT));
  // RoR check — auto-reduce if needed
  const ror=calcRoR(Math.max(0,edge),bankroll,blendedStake);
  let finalStake=blendedStake;
  if(ror>0.30)finalStake=safestake(edge,bankroll,0.30);
  if(slipRole==='anchor')finalStake*=1.1;if(slipRole==='trap')finalStake*=.9;
  finalStake=Math.max(MIN_STAKE_FLOOR,Math.min(finalStake,bankroll*MAX_STAKE_CAP_PCT));
  finalStake=Math.round(finalStake/100)*100;
  ICB.publish('ror','final_stake',{stake:finalStake,ror,edge});
  return{stake:finalStake,fraction:elasticFraction,targetStake:Math.round(targetStakePerSlip),kellyStake:Math.round(kellyStake),ror};
}

// SLIP BUILDING (v11.1 + ISV + correlation scoring)
// ═══════════════════════════════════════════════════════════════════
function slipBasedPnL(){
  let totalPnL=0,slipsWon=0,slipsLost=0,slipsPending=0;
  accas.forEach(a=>{
    if(a.type==='daily_15k_matrix'||a.type==='mastermind_matrix'){
      const G=gradeAcca(a);
      [['s1','slip1Return'],['s2','slip2Return'],['s3','slip3Return']].forEach(([sk,rk])=>{
        if(G[sk]==='won'){totalPnL+=(a[rk]||0)-(a.singleStake||5000);slipsWon++;}
        else if(G[sk]==='lost'){totalPnL-=(a.singleStake||5000);slipsLost++;}
        else slipsPending++;
      });
    }
  });
  const slipsSettled=slipsWon+slipsLost;
  ICB.publish('strategy','pnl',{totalPnL,slipsWon,slipsLost,slipsPending});
  return{totalPnL,slipsWon,slipsLost,slipsPending,winRate:slipsSettled>0?(slipsWon/slipsSettled)*100:0,slipsSettled};
}
function collectAllLegs(gamesList){
  const blacklist=getBlacklist();
  const cg=gamesList.map(g=>({g,p:getPred(g)})).filter(x=>x.p);
  let allLegs=[];
  cg.forEach(x=>{
    x.p.markets.forEach(m=>{
      const odd=m.useOdd||m.ghostOdd;
      if(m.lowValue||m.oddsTrick)return;
      if(blacklist.includes(x.g.home)&&m.name==='Home Win')return;
      if(blacklist.includes(x.g.away)&&m.name==='Away Win')return;
      if(odd<MIN_ODD||odd>20)return;
      if(m.corrProb<0.40)return;
      if(!m.fromInput&&(m.ghostConf||0)<50)return; // G5: exclude low-conf ghosts
      const gapBonus=(m.gapData?.isValue)?10:0;
      const trapPenalty=m.isTrap?-15:0;
      const enteredBonus=m.fromInput?10:0;
      const sureBonus=m.isSureWin?8:0;
      allLegs.push({g:x.g,m,useOdd:odd,prob:m.corrProb,
        score:m.compositeScore+(m.corrProb*15)+((m.realEV||0)*8)+gapBonus+trapPenalty+enteredBonus+sureBonus,
        lT:x.p.lT,isSureWin:m.isSureWin,isGhost:m.isGhost,isTrap:m.isTrap,
        gapData:m.gapData,ghostConf:m.ghostConf||0,corrMatrix:x.p.corrMatrix});
    });
  });
  return allLegs;
}
function buildSlipFromPool(legPool,targetMin,targetMax,usedGameIds,usedMarkets,preferSure,minProb,corrMatrix){
  let sorted=[...legPool].sort((a,b)=>{
    if(preferSure){if(a.isSureWin&&!b.isSureWin)return -1;if(!a.isSureWin&&b.isSureWin)return 1;}
    return(b.prob*.7+b.score*.3)-(a.prob*.7+a.score*.3);
  }).slice(0,60);
  if(usedMarkets?.size>0)sorted=sorted.filter(l=>!usedMarkets.has(l.m.name));
  if(minProb)sorted=sorted.filter(l=>l.prob>=minProb);
  let best=null,bestScore=-1;
  for(let i=0;i<sorted.length;i++){
    const l1=sorted[i];if(usedGameIds.has(l1.g.id))continue;
    for(let j=i+1;j<sorted.length;j++){
      const l2=sorted[j];if(l1.g.id===l2.g.id||usedGameIds.has(l2.g.id))continue;
      for(let k=j+1;k<sorted.length;k++){
        const l3=sorted[k];
        if(l1.g.id===l3.g.id||l2.g.id===l3.g.id||usedGameIds.has(l3.g.id))continue;
        const odd=l1.useOdd*l2.useOdd*l3.useOdd;
        if(odd>=targetMin&&odd<=targetMax){
          const prob=l1.prob*l2.prob*l3.prob;
          // MODULE D: Correlation bonus — prefer positively correlated legs
          const corrBonus=slipCorrBonus([l1,l2,l3],corrMatrix)*20;
          const score=(l1.score+l2.score+l3.score)+(prob*100)+corrBonus+
            ((l1.isSureWin?1:0)+(l2.isSureWin?1:0)+(l3.isSureWin?1:0))*5;
          if(score>bestScore){bestScore=score;best={legs:[l1,l2,l3],odd,prob,score,corrBonus};}
        }
      }
    }
  }
  return best;
}
function buildSmartGuardianSlip(slip1,slip2,allLegs,targetMin,targetMax){
  let guardianLegs=[],usedGameIds=new Set();
  const anchors=[];if(slip1?.legs)anchors.push(...slip1.legs.slice(0,2));if(slip2?.legs)anchors.push(...slip2.legs.slice(0,1));
  for(const anchor of anchors){
    if(guardianLegs.length>=LEGS_PER_SLIP)break;
    const oppName=getOppositeMarket(anchor.m.name);if(!oppName)continue;
    const anchorPred=getPred(anchor.g);if(!anchorPred)continue;
    const oppMkt=anchorPred.markets.find(m=>m.name===oppName);if(!oppMkt)continue;
    if(oppMkt.corrProb>=.55){const oppOdd=oppMkt.useOdd||oppMkt.ghostOdd;
      if(oppOdd>=MIN_ODD&&oppOdd<=12){guardianLegs.push({g:anchor.g,m:oppMkt,useOdd:oppOdd,prob:oppMkt.corrProb,score:oppMkt.compositeScore,lT:anchorPred.lT,isSureWin:oppMkt.isSureWin,isGhost:oppMkt.isGhost,isGuard:true,ghostConf:oppMkt.ghostConf||0});usedGameIds.add(anchor.g.id);}}
  }
  if(guardianLegs.length<LEGS_PER_SLIP){const fillPool=allLegs.filter(l=>!usedGameIds.has(l.g.id)&&l.prob>=.65).sort((a,b)=>b.prob-a.prob);for(const leg of fillPool){if(guardianLegs.length>=LEGS_PER_SLIP)break;guardianLegs.push(leg);usedGameIds.add(leg.g.id);}}
  if(!guardianLegs.length)return null;
  const odd=guardianLegs.reduce((a,l)=>a*l.useOdd,1),prob=guardianLegs.reduce((a,l)=>a*l.prob,1);
  return{legs:guardianLegs,odd,prob,score:guardianLegs.reduce((s,l)=>s+(l.score||0),0),isGuardian:true};
}
function calcDutchingGuarantee(s1,s2,s3,totalStake){
  const p1=s1.prob||0,p2=s2.prob||0,p3=s3.prob||0;
  const pAllLose=(1-p1)*(1-p2)*(1-p3),pAtLeastOneWins=1-pAllLose;
  const sps=totalStake/3,r1=sps*s1.odd,r2=sps*s2.odd,r3=sps*s3.odd,minReturn=Math.min(r1,r2,r3);
  ICB.publish('strategy','guarantee',{pAtLeastOneWins,pAllLose,minReturn});
  return{pAtLeastOneWins,pAllLose,minReturn,profitIfWin:minReturn-totalStake,stakeRecovery:minReturn>=totalStake,returns:{s1:r1,s2:r2,s3:r3}};
}
function scoreStrategy(s1,s2,s3,corrMatrix){
  if(!s1||!s2||!s3)return -1;
  const pAnyWin=1-((1-s1.prob)*(1-s2.prob)*(1-s3.prob));
  const coverageBonus=s3.isGuardian?25:0;
  const sureCount=[...(s1.legs||[]),...(s2.legs||[]),...(s3.legs||[])].filter(l=>l.isSureWin).length;
  const enteredLegs=[...(s1.legs||[]),...(s2.legs||[]),...(s3.legs||[])].filter(l=>l.m?.fromInput).length;
  const midTarget=(SLIP_MIN_ODD+SLIP_MAX_ODD)/2;
  const oddAdherence=[s1,s2,s3].reduce((s,sl)=>s+Math.max(0,1-Math.abs(sl.odd-midTarget)/midTarget),0)/3;
  // ISV pre-check on slip 1 (quickest validation)
  const bankroll=getBankroll(),stake=5000;
  const isvResult=isvValidate(s1.legs||[],bankroll,stake,corrMatrix);
  const isvBonus=isvResult.valid?30:isvResult.passes*3;
  mpRecord('strategy','active',true);
  return(pAnyWin*200)+coverageBonus+(sureCount*5)+(oddAdherence*20)+(enteredLegs*3)+isvBonus;
}
function runStrategyTournament(gamesList){
  const allLegs=collectAllLegs(gamesList);
  const corrMatrix=allLegs[0]?.corrMatrix||null;
  log_('info','TOURNAMENT',`${allLegs.length} legs from ${gamesList.length} games`);
  if(allLegs.length<LEGS_PER_SLIP)return null;
  const strategies=[];
  // v12.1: All bands target 3.15-3.30 so ANY single slip win recovers total stake
  const oddBands=[[3.15,3.30],[3.15,3.28],[3.16,3.30],[3.18,3.30],[3.15,3.25],[3.20,3.30],[3.15,3.22],[3.18,3.28],[3.16,3.26]];
  const coverModes=['mirror','opposite','dutch','cross','hybrid'];
  const preferOpts=[true,false,true,true,false,true,true,false,true];
  let vi=0;
  for(let b=0;b<oddBands.length;b++){for(let c=0;c<coverModes.length;c++){vi++;if(vi>NUM_STRATEGIES)break;
    const[minO,maxO]=oddBands[b];const preferSure=preferOpts[(b+c)%preferOpts.length];
    const usedGames=new Set(),usedMarkets=new Set();
    const s1=buildSlipFromPool(allLegs,minO,maxO,usedGames,usedMarkets,true,0.60,corrMatrix);if(!s1)continue;
    s1.legs.forEach(l=>{usedGames.add(l.g.id);usedMarkets.add(l.m.name);});
    const s2=buildSlipFromPool(allLegs,minO,maxO,usedGames,usedMarkets,preferSure,0.55,corrMatrix);if(!s2)continue;
    s2.legs.forEach(l=>{usedGames.add(l.g.id);usedMarkets.add(l.m.name);});
    let s3=buildSmartGuardianSlip(s1,s2,allLegs,minO,maxO);
    if(!s3)s3=buildSlipFromPool(allLegs,minO,maxO,new Set(),new Set(),preferSure,0.55,corrMatrix);
    if(!s3)continue;
    const sc=scoreStrategy(s1,s2,s3,corrMatrix),guarantee=calcDutchingGuarantee(s1,s2,s3,15000);
    // MODULE B: ISV validation on all 3 slips
    const bankroll=getBankroll(),stake=5000;
    const isv1=isvValidate(s1.legs,bankroll,stake,corrMatrix);
    const isv2=isvValidate(s2.legs,bankroll,stake,corrMatrix);
    const isv3=isvValidate(s3.legs,bankroll,stake,corrMatrix);
    const isvAllPass=isv1.valid&&isv2.valid&&isv3.valid;
    const isvMinPasses=Math.min(isv1.passes,isv2.passes,isv3.passes);
    // v12.1: Dutch system check — P(all 3 lose) must be <=10%
    const dutchCheck=isvDutchCheck(s1,s2,s3);
    strategies.push({id:vi,mode:coverModes[c],band:`${minO}-${maxO}`,slip1:s1,slip2:s2,slip3:s3,sc,guarantee,isv1,isv2,isv3,isvAllPass,isvMinPasses,dutchCheck});
  }}
  memory.comparisons+=strategies.length;
  if(!strategies.length)return null;
  strategies.sort((a,b)=>{
    // v12.1: Dutch P(all lose)<=10% comes first
    const adp=a.dutchCheck?.passes||false,bdp=b.dutchCheck?.passes||false;
    if(adp&&!bdp)return -1; if(!adp&&bdp)return 1;
    // Then ISV-valid strategies
    if(a.isvAllPass&&!b.isvAllPass)return -1;if(!a.isvAllPass&&b.isvAllPass)return 1;

    const dpA=a.dutchCheck?.pWin||0,dpB=b.dutchCheck?.pWin||0;
    if(Math.abs(dpA-dpB)>0.01)return dpB-dpA;
    const pA=a.guarantee.pAtLeastOneWins,pB=b.guarantee.pAtLeastOneWins;
    return pB!==pA?pB-pA:b.sc-a.sc;
  });
  const winner=strategies[0];
  log_('info','TOURNAMENT',`Winner #${winner.id} ISV:${winner.isvAllPass?'ALL PASS':winner.isvMinPasses+'/8'} P(win)=${(winner.guarantee.pAtLeastOneWins*100).toFixed(1)}%`);
  ICB.publish('strategy','winner',{id:winner.id,pWin:winner.guarantee.pAtLeastOneWins,isvAllPass:winner.isvAllPass});
  mpRecord('strategy','prediction',winner.isvAllPass);

}

// ═══════════════════════════════════════════════════════════════════
function evalMkt(name,hg,ag,hhg,hag){
  if(name==null||hg==null||ag==null||isNaN(+hg)||isNaN(+ag))return null;
  const t=+hg+ +ag,h=+hg,a=+ag,ht=(hhg!=null&&hag!=null)?(+hhg+ +hag):null;
  if(name==='Home Win')return h>a;if(name==='Draw')return h===a;if(name==='Away Win')return a>h;
  if(name==='Double Chance 1X')return h>=a;if(name==='Double Chance X2')return a>=h;if(name==='Double Chance 12')return h!==a;
  if(name==='Over 1.5')return t>=2;if(name==='Under 1.5')return t<2;if(name==='Over 2.5')return t>=3;if(name==='Under 2.5')return t<3;
  if(name==='Over 3.5')return t>=4;if(name==='Under 3.5')return t<4;if(name==='Over 4.5')return t>=5;if(name==='Under 4.5')return t<5;
  if(name==='BTTS Yes')return h>=1&&a>=1;if(name==='BTTS No')return!(h>=1&&a>=1);
  if(name==='HT Over 0.5')return ht!=null?ht>=1:null;if(name==='HT Under 0.5')return ht!=null?ht<1:null;if(name==='HT Over 1.5')return ht!=null?ht>=2:null;
  if(name==='Home to Score')return h>=1;if(name==='Away to Score')return a>=1;if(name==='Home Over 1.5')return h>=2;if(name==='Away Over 1.5')return a>=2;
  if(name==='Home Win to Nil')return h>a&&a===0;if(name==='Away Win to Nil')return a>h&&h===0;
  if(name?.startsWith('Correct Score')){const mx=name.match(/(\d+)-(\d+)/);return mx?(+mx[1]===h&&+mx[2]===a):null;}
  return null;
}
function gradeAcca(a){
  if(a.type==='daily_15k_matrix'||a.type==='mastermind_matrix'){
    const gradeSlip=(legs)=>{
      if(!Array.isArray(legs)||!legs.length)return'pending';
      let lost=false,pending=false;
      legs.forEach(l=>{const g=games.find(x=>x.id===l.gid);
        if(g&&statusOf(g)==='finished'){const r=results[l.gid];
          if(r?.hg!=null){const e=evalMkt(l.label,r.hg,r.ag,r.hhg,r.hag);if(e===false)lost=true;else if(e===null)pending=true;}else pending=true;
        }else pending=true;});
      if(lost)return'lost';if(pending)return'pending';return'won';
    };
    const s1=gradeSlip(a.slip1),s2=gradeSlip(a.slip2),s3=gradeSlip(a.slip3);
    return{s1,s2,s3,status:(s1==='won'||s2==='won'||s3==='won')?'won':(s1==='lost'&&s2==='lost'&&s3==='lost')?'lost':'pending'};
  }
  return{s1:'pending',s2:'pending',s3:'pending',status:'pending'};
}
function makeSnap(p){
  if(!p)return null;const m=p.recommendation.market;
  return{ts:Date.now(),rms:p.rms,confTier:p.confTier,lT:p.lT,hw:p.hw,dr:p.dr,aw:p.aw,topScore:p.topScore,modelConfident:p.modelConfident,
    recommendation:{market:m?{name:m.name,fromInput:m.fromInput,realOdd:m.realOdd,ghostOdd:m.ghostOdd,fairOdd:m.fairOdd,useOdd:m.useOdd,realEV:m.realEV,corrProb:m.corrProb,isSureWin:m.isSureWin,isGhost:m.isGhost,isTrap:m.isTrap,gapData:m.gapData,ghostConf:m.ghostConf}:null,tier:p.recommendation.tier,message:p.recommendation.message},
    markets:(p.markets||[]).map(m=>({name:m.name,corrProb:m.corrProb,fromInput:m.fromInput,realOdd:m.realOdd,ghostOdd:m.ghostOdd,fairOdd:m.fairOdd,useOdd:m.useOdd,realEV:m.realEV,lowValue:m.lowValue,isGhost:m.isGhost,isTrap:m.isTrap,gapData:m.gapData,ghostConf:m.ghostConf}))};
}
function ensureSnaps(){let ch=false;games.forEach(g=>{if(!g.snapshot){const p=getPred(g);if(p){g.snapshot=makeSnap(p);ch=true;}}});if(ch)save();}
function diagnose(g){
  const r=results[g.id],s=g.snapshot;if(!r||!s)return null;
  if(s.recommendation.tier==='nobet')return{hit:null,diagnosis:'nobet',reasons:'No bet — loss avoided.'};
  const hit=evalMkt(s.recommendation.market?.name||'',r.hg,r.ag,r.hhg,r.hag);
  const reasons=[];
  if(s.rms>=.16)reasons.push('high model RMS');else if(s.rms<.08)reasons.push('confident model');
  if(!s.recommendation.market?.fromInput)reasons.push('ghost odd used');else reasons.push('real odd used');
  if(s.recommendation.market?.isTrap)reasons.push('⚠ bookie trap present');
  return{hit,diagnosis:hit===true?'confirmed':s.rms<.08&&hit===false?'surprise':'expected',reasons:reasons.join('; ')};
}

function addGame(){

function lockDailyStrategy(){
  const strategy=generateDailyStrategy(analysable());if(!strategy)return;
  const mkLegs=(slip)=>(!slip?.legs)?[]:slip.legs.map(l=>({gid:l.g.id,label:l.m.name,odd:l.useOdd,home:l.g.home,away:l.g.away,league:l.g.league,start:l.g.start,isSureWin:l.isSureWin,isGhost:l.isGhost,isGuard:l.isGuard||false,isTrap:l.isTrap,ghostConf:l.ghostConf||0}));

    slip3:mkLegs(strategy.slip3),slip3Odd:strategy.slip3?.odd||1.5,slip3Return:strategy.slip3Return||0,
    maxReturn:strategy.maxReturn||0,guarantee:strategy.guarantee,isvAllPass:strategy.isvAllPass,isvMinPasses:strategy.isvMinPasses};
  accas.push(obj);
  log_('ok','LOCK',`Matrix #${strategy.strategyId} locked. ISV:${strategy.isvAllPass?'ALL PASS':strategy.isvMinPasses+'/8'} P(win)=${(strategy.guarantee.pAtLeastOneWins*100).toFixed(1)}%`);
  autoLearn('lock-strategy');regenerateNextStrategy();save();buildNav();
  const msg=document.getElementById('lk-msg');
  if(msg){msg.innerHTML='🔐 Locked! <a href="#" onclick="trackerV=\'accas\';go(\'tracker\');return false" style="color:var(--blue);text-decoration:underline">View in Strategy →</a>';msg.style.color='var(--green)';}
}

  const graded=[];

// ── WEB WORKER REGENERATION ─────────────────────────────────────
// Tournament runs in background — ZERO main thread freeze
let _workerBusy=false;
function workerRegen(){
  if(_workerBusy)return; // Don't stack workers
  const games2=analysable();if(!games2.length)return;
  // Slim data for worker — only what it needs
  const slimGames=games2.map(g=>({id:g.id,odds:g.odds||{},league:g.league||''}));
  _workerBusy=true;
  try{
    // Build self-contained worker code with embedded Poisson engine
    const workerCode=buildWorkerCode();
    const blob=new Blob([workerCode],{type:'application/javascript'});
    const url=URL.createObjectURL(blob);
    const worker=new Worker(url);
    worker.postMessage({games:slimGames,bankroll:getBankroll(),targets:loadTargets(),pnl:slipBasedPnL().totalPnL});
    worker.onmessage=e=>{
      _workerBusy=false;
      URL.revokeObjectURL(url);
      worker.terminate();
      if(e.data&&e.data.strategy){
        nextStrategy=e.data.strategy;
        log_('ok','WORKER',`Strategy #${e.data.strategy.strategyId} ready`);
        ICB.publish('strategy','worker_result',{id:e.data.strategy.strategyId});
      }
    };
    worker.onerror=err=>{
      _workerBusy=false;URL.revokeObjectURL(url);worker.terminate();
      // Fallback to sync on worker failure
      try{nextStrategy=generateDailyStrategy(analysable());save();}catch(e){}
    };
  }catch(e){
    _workerBusy=false;
    // Fallback: deferred sync regeneration
    setTimeout(()=>{try{regenerateNextStrategy();}catch(e2){}},1000);
  }
}

// Build the self-contained worker script
// Worker has its own mini Poisson engine — no DOM, no closures needed
function buildWorkerCode(){
  return `
'use strict';
// Mini Poisson engine for Web Worker
const FC=[1];for(let i=1;i<=20;i++)FC[i]=FC[i-1]*i;
function pois(k,l){if(l<=0)return k===0?1:0;if(k>20)return 0;return Math.exp(-l)*Math.pow(l,k)/FC[k];}
function clamp(x,lo=.001,hi=.999){return Math.min(hi,Math.max(lo,x));}
function tau(x,y,l1,l2,rho){if(x===0&&y===0)return Math.max(.001,1-l1*l2*rho);if(x===0&&y===1)return Math.max(.001,1+l1*rho);if(x===1&&y===0)return Math.max(.001,1+l2*rho);if(x===1&&y===1)return Math.max(.001,1-rho);return 1;}
function nbPmf(l,d){if(d<.02){const a=[];for(let k=0;k<=8;k++)a[k]=pois(k,l);return a;}const r=1/Math.max(d,.001),p=r/(r+l),a=[];for(let k=0;k<=8;k++){let lp=0;for(let j=0;j<k;j++)lp+=Math.log(r+j)-Math.log(j+1);lp+=r*Math.log(p)+k*Math.log(1-p);a[k]=Math.exp(lp);}return a;}
function strip(odd,m){return odd>1?clamp((1/odd)/(1+m)):null;}
function fitModelSlim(o){
  if(!(o.home>1&&o.draw>1&&o.away>1&&o.o25>1))return null;
  const raw=[1/o.home,1/o.draw,1/o.away];
  const s=raw.reduce((a,b)=>a+b,0);
  const fh=raw[0]/s,fa=raw[2]/s;
  const M1=clamp(s-1,.04,.12),mT=M1*.80;
  const iv=o.o15>1&&o.o25>1?Math.abs(strip(o.o15,mT)-strip(o.o25,mT))/.35:.5;
  const disp=iv>.65?.18:.06;
  const oddsRatio=Math.sqrt(Math.max(fh,.05)/Math.max(fa,.05));
  function sc(l1,l2,rho){
    const pm1=nbPmf(l1,disp),pm2=nbPmf(l2,disp);
    let hw=0,dr=0,aw=0,o25=0,tot=0;
    for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){let v=tau(i,j,l1,l2,rho)*pm1[i]*pm2[j];if(v<0)v=0;tot+=v;if(i>j)hw+=v;else if(i===j)dr+=v;else aw+=v;if(i+j>=3)o25+=v;}
    if(tot>0){hw/=tot;dr/=tot;aw/=tot;o25/=tot;}
    const tp=strip(o.o25,mT)||0.45;
    const err=(hw-fh)**2*2.5+(dr-raw[1]/s)**2*2.0+(aw-fa)**2*2.5+(o25-tp)**2*2.5+(l1/Math.max(l2,.01)-oddsRatio)**2*.3;
    return{err,hw,dr,aw,o25};
  }
  let best=null;
  for(let lt=0.5;lt<=4.5;lt+=0.20)for(let s2=0.10;s2<=0.90;s2+=0.015){
    const l1=lt*s2,l2=lt*(1-s2);
    for(const rho of[-.20,-.10,0,.05]){
      const r=sc(l1,l2,rho);if(!best||r.err<best.err)best={l1,l2,rho,disp,...r};
    }
  }
  return best||{l1:1.2,l2:0.9,rho:-.10,disp:.06,hw:.45,dr:.28,aw:.27,o25:.48};
}
function getProbs(o){
  const f=fitModelSlim(o);if(!f)return null;
  const MIN_ODD=1.30;
  const mkts=[];
  const addM=(name,rawP,entOdd)=>{
    const fromInput=!!(entOdd&&entOdd>1);
    const useOdd=fromInput?entOdd:Math.max(1.05,Math.round((1/Math.max(rawP,.01))*20)/20);
    if(useOdd<MIN_ODD||rawP<0.30)return;
    mkts.push({name,prob:rawP,useOdd,fromInput,isGhost:!fromInput,ghostConf:fromInput?100:50});
  };
  addM('Home Win',f.hw,o.home);addM('Draw',f.dr,o.draw);addM('Away Win',f.aw,o.away);
  addM('Over 2.5',f.o25,o.o25);addM('Under 2.5',1-f.o25,null);
  if(o.btts>1)addM('BTTS Yes',f.hw*.6+f.o25*.3,o.btts);
  if(o.o15>1)addM('Over 1.5',Math.min(.95,f.o25+.22),o.o15);
  addM('Double Chance 1X',f.hw+f.dr,o.dc1x>1?o.dc1x:null);
  addM('Double Chance X2',f.dr+f.aw,null);
  return{l1:f.l1,l2:f.l2,hw:f.hw,dr:f.dr,aw:f.aw,mkts};
}
function buildSlip(legs,targetMin,targetMax,usedIds){
  const pool=legs.filter(l=>!usedIds.has(l.gid)&&l.prob>=0.55&&l.odd>=1.20).sort((a,b)=>b.prob-a.prob);
  let best=null,bestScore=-1;
  for(let i=0;i<Math.min(pool.length,30);i++){
    if(usedIds.has(pool[i].gid))continue;
    for(let j=i+1;j<Math.min(pool.length,30);j++){
      if(pool[i].gid===pool[j].gid||usedIds.has(pool[j].gid))continue;
      for(let k=j+1;k<Math.min(pool.length,30);k++){
        if(pool[i].gid===pool[k].gid||pool[j].gid===pool[k].gid||usedIds.has(pool[k].gid))continue;
        const odd=pool[i].odd*pool[j].odd*pool[k].odd;
        if(odd<targetMin||odd>targetMax)continue;
        const prob=pool[i].prob*pool[j].prob*pool[k].prob;
        const score=prob*100+(pool[i].fromInput?3:0)+(pool[j].fromInput?3:0)+(pool[k].fromInput?3:0);
        if(score>bestScore){bestScore=score;best={legs:[pool[i],pool[j],pool[k]],odd,prob,score};}
      }
    }
  }
  return best;
}
self.onmessage=function(e){
  const{games,bankroll,targets,pnl}=e.data;
  const allLegs=[];
  games.forEach(g=>{
    const p=getProbs(g.odds||{});if(!p)return;
    p.mkts.forEach(m=>{
      if(m.prob<0.45||m.useOdd<1.20||m.useOdd>15)return;
      allLegs.push({gid:g.id,name:m.name,odd:m.useOdd,prob:m.prob,fromInput:m.fromInput,score:m.prob*10});
    });
  });
  if(allLegs.length<9){self.postMessage({strategy:null});return;}
  const bands=[[3.15,3.30],[3.16,3.28],[3.18,3.30],[3.15,3.26],[3.20,3.30]];
  let best=null;
  bands.forEach(([lo,hi])=>{
    const u1=new Set(),u2=new Set();
    const s1=buildSlip(allLegs,lo,hi,u1);if(!s1)return;
    s1.legs.forEach(l=>u1.add(l.gid));
    const s2=buildSlip(allLegs,lo,hi,u1);if(!s2)return;
    s2.legs.forEach(l=>u2.add(l.gid));u1.forEach(id=>u2.add(id));
    const s3=buildSlip(allLegs,lo,hi,u2);if(!s3)return;
    const pLose=(1-s1.prob)*(1-s2.prob)*(1-s3.prob);
    const pWin=1-pLose;
    const sc=pWin*200+(s1.score+s2.score+s3.score);
    if(!best||sc>best.sc){
      const stake=Math.max(5000,Math.round(Math.min(bankroll*0.1,(targets?.daily?.target||50000)/6)/100)*100);
      best={slip1:s1,slip2:s2,slip3:s3,sc,pWin,pLose,guarantee:{pAtLeastOneWins:pWin,pAllLose:pLose,stakeRecovery:s1.odd>=3.0,minReturn:stake*s1.odd},strategyId:Math.floor(Math.random()*9000)+1000,mode:'worker_dutch',band:lo+'-'+hi,strategiesTested:bands.length,slip1Stake:stake,slip2Stake:stake,slip3Stake:stake,totalStake:stake*3,slip1Return:Math.round(stake*s1.odd),slip2Return:Math.round(stake*s2.odd),slip3Return:Math.round(stake*s3.odd),maxReturn:Math.round(stake*(s1.odd+s2.odd+s3.odd)),guardianActive:true,isvAllPass:pWin>=0.85,isvMinPasses:pWin>=0.85?8:6,dutchCheck:{passes:pLose<=0.15,pWin,pLose,pWinPct:(pWin*100).toFixed(1),pLosePct:(pLose*100).toFixed(1)}};
    }
  });
  self.postMessage({strategy:best});
};
`;
}

    ICB._state={};ICB._history=[];ICB._actives=new Set();
    // Invalidate school cache
    invalidateSchoolCache();
    // Clear all file system files (overwrite with empty defaults)
    if(fsConnected){
      Promise.all([
        fsWriteJSON('games',{games:[],results:{},accas:[],ts:Date.now()}),
        fsWriteJSON('learning',{memory:{preds:[],studies:0,comparisons:0,insights:[]},peaks:{iq:100,learning:0},marketMarginMap:{},bookieSig:{},sureWins:[],leagueCorr:{},clvHistory:[],leagueIntel:{},modulePerf:{},ts:Date.now()}),
        fsWriteJSON('h2h',{h2hDB:{},ts:Date.now()}),
        fsWriteJSON('config',{bankroll:30000,targets:{daily:{target:50000,startTime:Date.now()},weekly:{target:200000,startTime:Date.now()},monthly:{target:1000000,startTime:Date.now()}},rorSettings:{targetRoR:0.10,warningRoR:0.30},ts:Date.now()}),
      ]).then(()=>{
        // Also clear the log file
        if(fsFiles.logs)fsFiles.logs.createWritable().then(w=>{w.write('');w.close();});
        fsUpdateSizes();
      }).catch(e=>console.warn('Reset file clear:',e));
    }
    // Remove IDB directory handle so next connect is fresh
    idbSet(IDB_KEY,null).catch(()=>{});
    // Reset bankroll and targets to default
    localStorage.setItem(BK,'30000');
    saveTargets({daily:{target:50000,startTime:Date.now()},weekly:{target:200000,startTime:Date.now()},monthly:{target:1000000,startTime:Date.now()}});
    closeM();buildNav();go('dashboard');
    setTimeout(()=>log_('warn','RESET','System fully reset to factory defaults'),100);
    return;
  }
  resetAtt++;
  if(resetAtt>=3){localStorage.setItem('s108lock',String(Date.now()+10*60000));if(box){box.querySelector('h3').textContent='❌ Locked';setTimeout(()=>{document.getElementById('mroot').innerHTML=lockedM(10*60000);},500);}return;}
  if(box){box.style.animation='shake .4s';setTimeout(()=>box.style.animation='',500);}
  if(msg)msg.textContent=3-resetAtt===1?'Wrong. Last try! 😬':`Wrong. ${3-resetAtt} left.`;
  if(box)box.querySelectorAll('div[style*="border-radius:50%"]').forEach((el,i)=>{if(i<resetAtt)el.style.background='var(--red)';});
  inp.value='';inp.focus();
}

// ═══════════════════════════════════════════════════════════════════
// BOOT SEQUENCE
// ═══════════════════════════════════════════════════════════════════
function tick(){const el=document.getElementById('clk');if(el)el.textContent=new Date().toLocaleTimeString('en-US',{timeZone:'Africa/Kampala',hour12:true,hour:'numeric',minute:'2-digit',second:'2-digit'});}
setInterval(tick,1000);tick();

// Init targets
const _initT=loadTargets();
if(!_initT.daily.startTime){_initT.daily.startTime=Date.now();_initT.weekly.startTime=Date.now();_initT.monthly.startTime=Date.now();saveTargets(_initT);}

// 15-second auto-update poll
let _lastSnap='';
setInterval(()=>{
  const snap=games.map(g=>g.id+statusOf(g)).join(',');
  if(snap!==_lastSnap){_lastSnap=snap;ensureSnaps();resolveMemoryPredictions();buildNav();if(['dashboard','analysis','live','tracker','school'].includes(currentTab))render(currentTab);}
  else if(currentTab==='live'&&byStatus('live').length)render('live');
},15000);

// Boot
fsInit().then(()=>{
  ensureSnaps();resolveMemoryPredictions();buildNav();renderDash();
  _lastSnap=games.map(g=>g.id+statusOf(g)).join(',');
  log_('ok','BOOT',`v12.0 ready · ${games.length} games · ICB active · File system: ${fsConnected?'connected':'localStorage only'}`);
  if(analysable().length>0)setTimeout(()=>{try{workerRegen();}catch(e){regenerateNextStrategy();}},800);
  // Mark all modules as seen so they appear in ICB bar
  ['devig','poisson','ghost','lambda','margin','recquality','ghostconf','isv','correlation','ror','league','school','filesystem','strategy','school_core'].forEach(m=>mpRecord(m,'active',true));
  ICB.publish('system','boot',{version:'12.0',ts:Date.now()});
  mpRecord('icb','active',true);
});
</script>
